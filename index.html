<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简洁书签</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script>
tailwind.config = {
  theme:{
    extend:{
      colors:{
        primary:'#2563eb'
      }
    }
  }
}
</script>
<style type="text/tailwindcss">
@layer utilities {
  .folder-item{@apply bg-white py-4 cursor-pointer transition-all border-b border-gray-200 flex items-center;}
  .link-item{@apply bg-white py-4 transition border-b border-gray-200;}
  .menu-item{@apply px-4 py-2.5 hover:bg-gray-100 cursor-pointer;}
}
</style>
</head>
<body class="bg-white text-gray-800 min-h-screen px-4">
<div class="max-w-xl mx-auto">
  <!-- 顶部标题+搜索+右上角菜单 -->
  <div class="flex items-center justify-between mb-4 pt-4">
    <h1 class="text-xl font-bold">我的书签</h1>
    <div class="relative">
      <button id="menuBtn" class="p-2">
        <i class="fa fa-ellipsis-v text-lg text-black"></i>
      </button>
      <div id="menuPanel" class="hidden absolute right-0 top-10 bg-white shadow-lg rounded-lg z-50 w-44">
        <div class="menu-item" onclick="openAddBookmark()">新建书签</div>
        <div class="menu-item" onclick="openAddFolder()">新建文件夹</div>
        <div class="menu-item" onclick="openSortSelect()">排序方式</div>
        <div class="menu-item" onclick="toggleDragMode()">拖拽排序</div>
        <div class="menu-item" onclick="importBookmark()">书签导入</div>
        <div class="menu-item" onclick="exportBookmark()">书签导出</div>
      </div>
    </div>
  </div>
  <!-- 搜索框 -->
  <input id="searchInput" placeholder="搜索书签名称或网址" class="w-full border border-gray-200 rounded-lg px-4 py-2 mb-6" oninput="doSearch()">

  <!-- 首页：先渲染文件夹，再渲染首页书签 -->
  <div id="page-index">
    <div id="folderWrap">
      <div class="folder-item" onclick="openFolder('软件')"><i class="fa fa-desktop text-xl mr-3 text-black"></i>软件</div>
      <div class="folder-item" onclick="openFolder('娱乐')"><i class="fa fa-gamepad text-xl mr-3 text-black"></i>娱乐</div>
      <div class="folder-item" onclick="openFolder('工具')"><i class="fa fa-wrench text-xl mr-3 text-black"></i>工具</div>
      <div class="folder-item" onclick="openFolder('资源')"><i class="fa fa-folder-open text-xl mr-3 text-black"></i>资源</div>
      <div class="folder-item" onclick="openFolder('其它')"><i class="fa fa-folder text-xl mr-3 text-black"></i>其它</div>
    </div>
    <div id="homeBookmarkWrap"></div>
  </div>

  <!-- 娱乐二级目录：阅读/音乐/影视，一行一个 -->
  <div id="folder-娱乐" class="hidden">
    <div class="flex items-center mb-4 pt-2">
      <button onclick="backIndex()" class="text-black mr-3"><i class="fa fa-arrow-left text-lg"></i></button>
      <h2 class="text-lg font-semibold">娱乐</h2>
    </div>
    <div class="folder-item" onclick="openSubFolder('娱乐','阅读')"><i class="fa fa-book text-xl mr-3 text-black"></i>阅读</div>
    <div class="folder-item" onclick="openSubFolder('娱乐','音乐')"><i class="fa fa-music text-xl mr-3 text-black"></i>音乐</div>
    <div class="folder-item" onclick="openSubFolder('娱乐','影视')"><i class="fa fa-film text-xl mr-3 text-black"></i>影视</div>
  </div>

  <!-- 书签列表页面 -->
  <div id="link-list" class="hidden">
    <div class="flex items-center mb-4 pt-2">
      <button onclick="backFolder()" class="text-black mr-3"><i class="fa fa-arrow-left text-lg"></i></button>
      <h2 id="list-title" class="text-lg font-semibold"></h2>
    </div>
    <div id="link-container"></div>
  </div>
</div>

<!-- 弹窗：新建书签（增加首页选项） -->
<div id="modalBookmark" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl w-full max-w-sm p-5">
    <h3 class="font-bold mb-4">新建书签</h3>
    <select id="bmFolderSelect" class="w-full border rounded px-3 py-2 mb-3">
      <option value="home">首页</option>
      <option value="软件">软件</option>
      <option value="工具">工具</option>
      <option value="资源">资源</option>
      <option value="其它">其它</option>
      <option value="娱乐-阅读">娱乐 / 阅读</option>
      <option value="娱乐-音乐">娱乐 / 音乐</option>
      <option value="娱乐-影视">娱乐 / 影视</option>
    </select>
    <input id="bmName" placeholder="名称" class="w-full border rounded px-3 py-2 mb-3">
    <input id="bmUrl" placeholder="网址" class="w-full border rounded px-3 py-2 mb-4">
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal('modalBookmark')" class="px-4 py-2 border rounded">取消</button>
      <button onclick="saveNewBookmark()" class="px-4 py-2 bg-primary text-white rounded">保存</button>
    </div>
  </div>
</div>

<!-- 弹窗：编辑书签 -->
<div id="modalEditBookmark" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl w-full max-w-sm p-5">
    <h3 class="font-bold mb-4">编辑书签</h3>
    <input id="editBmName" placeholder="名称" class="w-full border rounded px-3 py-2 mb-3">
    <input id="editBmUrl" placeholder="网址" class="w-full border rounded px-3 py-2 mb-4">
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal('modalEditBookmark')" class="px-4 py-2 border rounded">取消</button>
      <button onclick="saveEditBookmark()" class="px-4 py-2 bg-primary text-white rounded">保存</button>
    </div>
  </div>
</div>

<!-- 弹窗：新建文件夹 -->
<div id="modalFolder" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl w-full max-w-sm p-5">
    <h3 class="font-bold mb-4">新建文件夹</h3>
    <input id="fdName" placeholder="文件夹名称" class="w-full border rounded px-3 py-2 mb-4">
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal('modalFolder')" class="px-4 py-2 border rounded">取消</button>
      <button onclick="saveNewFolder()" class="px-4 py-2 bg-primary text-white rounded">保存</button>
    </div>
  </div>
</div>

<!-- 弹窗：排序选择 -->
<div id="modalSort" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl w-full max-w-sm p-5">
    <h3 class="font-bold mb-4">排序方式</h3>
    <div class="space-y-2">
      <div class="p-2 border rounded cursor-pointer" onclick="setSort('default')">默认顺序</div>
      <div class="p-2 border rounded cursor-pointer" onclick="setSort('nameAsc')">名称A-Z</div>
      <div class="p-2 border rounded cursor-pointer" onclick="setSort('nameDesc')">名称Z-A</div>
    </div>
    <div class="mt-4 flex justify-end">
      <button onclick="closeModal('modalSort')" class="px-4 py-2 border rounded">关闭</button>
    </div>
  </div>
</div>

<!-- 长按操作菜单 -->
<div id="longPressMenu" class="hidden fixed bg-white shadow-lg rounded-lg z-50 w-36">
  <div class="menu-item" onclick="editCurrentBookmark()">编辑书签</div>
  <div class="menu-item text-red-500" onclick="deleteCurrentBookmark()">删除书签</div>
</div>

<!-- 导入隐藏input -->
<input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">

<script>
// 所有文件夹内置测试书签，增加首页书签数组
let data = {
  "home":[],
  "软件": [
    {name:"GitHub",url:"https://github.com"}
  ],
  "娱乐": {
    "阅读":[
      {name:"微信读书",url:"https://weread.qq.com"}
    ],
    "音乐":[
      {name:"网易云音乐",url:"https://music.163.com"}
    ],
    "影视":[
      {name:"哔哩哔哩",url:"https://bilibili.com"}
    ]
  },
  "工具": [
    {name:"站长工具",url:"https://tool.chinaz.com"}
  ],
  "资源": [
    {name:"阿里云盘",url:"https://www.aliyundrive.com"}
  ],
  "其它": [
    {name:"百度",url:"https://www.baidu.com"}
  ]
};
let currentPath = [];
let sortType = "default";
let dragMode = false;
let longPressTimer = null;
let currentBookmarkIndex = null;
let currentBookmarkList = null;

// 右上角菜单
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
menuBtn.onclick = ()=> menuPanel.classList.toggle('hidden');
document.body.onclick = (e)=>{
  if(!menuBtn.contains(e.target) && !menuPanel.contains(e.target)){
    menuPanel.classList.add('hidden');
  }
  document.getElementById('longPressMenu').classList.add('hidden');
}

//渲染首页书签
function renderHomeBookmarks(){
  const wrap = document.getElementById('homeBookmarkWrap');
  let list = data.home;
  if(sortType === 'nameAsc') list = [...list].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  if(sortType === 'nameDesc') list = [...list].sort((a,b)=>b.name.localeCompare(a.name,'zh-CN'));
  wrap.innerHTML = list.map((item,idx)=>`
    <div class="link-item block ${dragMode?'cursor-move':''}" draggable="${dragMode}" data-idx="${idx}">
      <a href="${item.url}" target="_blank" class="block pointer-events-none">
        <div class="font-medium text-base">${item.name}</div>
        <div class="text-sm text-gray-500 mt-1 break-all">${item.url}</div>
      </a>
    </div>`).join('');
  //绑定长按（拖拽模式关闭才启用长按）
  if(!dragMode){
    const items = wrap.querySelectorAll('.link-item');
    items.forEach(el=> bindLongPress(el,list));
  }
  if(dragMode) bindDragEvent(wrap);
}

// 回到首页
function backIndex(){
  currentPath = [];
  document.getElementById('page-index').classList.remove('hidden');
  document.getElementById('folder-娱乐').classList.add('hidden');
  document.getElementById('link-list').classList.add('hidden');
  renderHomeBookmarks();
}
// 打开一级文件夹
function openFolder(name){
  if(name === '娱乐'){
    document.getElementById('page-index').classList.add('hidden');
    document.getElementById('folder-娱乐').classList.remove('hidden');
    currentPath = ['娱乐'];
  }else{
    currentPath = [name];
    renderLinkList(name);
  }
}
// 打开娱乐下二级子文件夹
function openSubFolder(parent, sub){
  currentPath = [parent, sub];
  renderLinkList(sub);
}
// 返回上一级
function backFolder(){
  currentPath.pop();
  if(currentPath.length === 0){
    backIndex();
  }else if(currentPath.length ===1 && currentPath[0]==='娱乐'){
    document.getElementById('page-index').classList.add('hidden');
    document.getElementById('folder-娱乐').classList.remove('hidden');
    document.getElementById('link-list').classList.add('hidden');
  }
}
// 获取当前书签数组
function getCurrentList(){
  const [p1,p2] = currentPath;
  if(p2) return data[p1][p2];
  return data[p1];
}

//绑定长按函数
function bindLongPress(el,list){
  el.addEventListener('touchstart',(e)=>{
    longPressTimer = setTimeout(()=>{
      e.preventDefault();
      currentBookmarkIndex = Number(el.dataset.idx);
      currentBookmarkList = list;
      showLongMenu(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    },600)
  })
  el.addEventListener('touchend',()=>clearTimeout(longPressTimer));
  el.addEventListener('touchcancel',()=>clearTimeout(longPressTimer));
  el.addEventListener('mousedown',()=>{
    longPressTimer = setTimeout(()=>{
      currentBookmarkIndex = Number(el.dataset.idx);
      currentBookmarkList = list;
      const rect = el.getBoundingClientRect();
      showLongMenu(rect.left, rect.bottom);
    },600)
  })
  el.addEventListener('mouseup',()=>clearTimeout(longPressTimer));
  el.addEventListener('mouseleave',()=>clearTimeout(longPressTimer));
}

// 渲染链接（名字在上，网址在下）
function renderLinkList(title){
  document.getElementById('page-index').classList.add('hidden');
  document.getElementById('folder-娱乐').classList.add('hidden');
  document.getElementById('link-list').classList.remove('hidden');
  document.getElementById('list-title').innerText = title;
  let list = getCurrentList();
  //排序
  if(sortType === 'nameAsc') list = [...list].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  if(sortType === 'nameDesc') list = [...list].sort((a,b)=>b.name.localeCompare(a.name,'zh-CN'));

  const dom = document.getElementById('link-container');
  dom.innerHTML = list.map((item,idx)=>`
    <div class="link-item block ${dragMode?'cursor-move':''}" draggable="${dragMode}" data-idx="${idx}">
      <a href="${item.url}" target="_blank" class="block pointer-events-none">
        <div class="font-medium text-base">${item.name}</div>
        <div class="text-sm text-gray-500 mt-1 break-all">${item.url}</div>
      </a>
    </div>`).join('');

  //仅非拖拽模式启用长按
  if(!dragMode){
    const items = dom.querySelectorAll('.link-item');
    items.forEach(el=> bindLongPress(el,list));
  }
  if(dragMode) bindDragEvent(dom);
}
function showLongMenu(x,y){
  const menu = document.getElementById('longPressMenu');
  menu.style.left = `${x}px`;
  menu.style.top = `${y}px`;
  menu.classList.remove('hidden');
}

// 搜索
function doSearch(){
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!kw){
    if(currentPath.length ===0) {backIndex();return;}
    renderLinkList(currentPath.at(-1));
    return;
  }
  const all = getAllBookmarks();
  const result = all.filter(x=> x.name.toLowerCase().includes(kw) || x.url.toLowerCase().includes(kw));
  const dom = document.getElementById('link-container');
  document.getElementById('page-index').classList.add('hidden');
  document.getElementById('folder-娱乐').classList.add('hidden');
  document.getElementById('link-list').classList.remove('hidden');
  document.getElementById('list-title').innerText = "搜索结果";
  dom.innerHTML = result.map(item=>`
    <div class="link-item block">
      <a href="${item.url}" target="_blank" class="block">
        <div class="font-medium text-base">${item.name}</div>
        <div class="text-sm text-gray-500 mt-1 break-all">${item.url}</div>
      </a>
    </div>`).join('');
}
function getAllBookmarks(){
  const arr = [...data.home];
  for(const k in data){
    if(k === "home") continue;
    if(k==='娱乐'){
      for(const sk in data.娱乐){
        data.娱乐[sk].forEach(x=>arr.push(x));
      }
    }else{
      data[k].forEach(x=>arr.push(x));
    }
  }
  return arr;
}

//菜单功能
function openAddBookmark(){closeAllMenu(); openModal('modalBookmark');}
function openAddFolder(){closeAllMenu(); openModal('modalFolder');}
function openSortSelect(){closeAllMenu(); openModal('modalSort');}
function toggleDragMode(){
  dragMode = !dragMode;
  closeAllMenu();
  alert(dragMode?"拖拽排序已开启（长按编辑暂时关闭）":"拖拽排序关闭，长按编辑恢复");
  if(currentPath.length ===0){
    renderHomeBookmarks();
  }else{
    renderLinkList(currentPath.at(-1));
  }
}
function importBookmark(){closeAllMenu(); document.getElementById('importFile').click();}
function exportBookmark(){closeAllMenu(); downloadJson(data,"bookmark.json");}

//弹窗
function openModal(id){document.getElementById(id).classList.remove('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function closeAllMenu(){menuPanel.classList.add('hidden');}

//保存新书签（支持首页）
function saveNewBookmark(){
  const folderSel = document.getElementById('bmFolderSelect').value;
  const name = document.getElementById('bmName').value.trim();
  let url = document.getElementById('bmUrl').value.trim();
  if(!name || !url) return alert('名称网址不能为空');
  if(!/^https?:\/\//.test(url)) url = 'https://'+url;

  let targetList;
  if(folderSel === 'home'){
    targetList = data.home;
  }else if(folderSel.indexOf('娱乐-')===0){
    const sub = folderSel.replace('娱乐-','');
    targetList = data.娱乐[sub];
  }else{
    targetList = data[folderSel];
  }
  targetList.push({name,url});
  closeModal('modalBookmark');
  document.getElementById('bmName').value='';
  document.getElementById('bmUrl').value='';
  document.getElementById('bmFolderSelect').value='';
  if(currentPath.length===0){
    renderHomeBookmarks();
  }else{
    renderLinkList(currentPath.at(-1));
  }
}

//编辑书签
function editCurrentBookmark(){
  closeAllMenu();
  const item = currentBookmarkList[currentBookmarkIndex];
  document.getElementById('editBmName').value = item.name;
  document.getElementById('editBmUrl').value = item.url;
  openModal('modalEditBookmark');
}
function saveEditBookmark(){
  const name = document.getElementById('editBmName').value.trim();
  let url = document.getElementById('editBmUrl').value.trim();
  if(!name || !url) return alert('名称网址不能为空');
  if(!/^https?:\/\//.test(url)) url = 'https://'+url;
  currentBookmarkList[currentBookmarkIndex].name = name;
  currentBookmarkList[currentBookmarkIndex].url = url;
  closeModal('modalEditBookmark');
  if(currentPath.length ===0){
    renderHomeBookmarks();
  }else{
    renderLinkList(currentPath.at(-1));
  }
}
//删除书签
function deleteCurrentBookmark(){
  if(!confirm("确定删除该书签？")) return;
  currentBookmarkList.splice(currentBookmarkIndex,1);
  document.getElementById('longPressMenu').classList.add('hidden');
  if(currentPath.length ===0){
    renderHomeBookmarks();
  }else{
    renderLinkList(currentPath.at(-1));
  }
}

//新建文件夹（仅一级目录）
function saveNewFolder(){
  const fdName = document.getElementById('fdName').value.trim();
  if(!fdName) return alert('文件夹名称不能为空');
  if(data[fdName]) return alert('文件夹已存在');
  data[fdName]=[];
  closeModal('modalFolder');
  backIndex();
  document.getElementById('fdName').value='';
}
//设置排序
function setSort(type){
  sortType = type;
  closeModal('modalSort');
  if(currentPath.length ===0){
    renderHomeBookmarks();
  }else{
    renderLinkList(currentPath.at(-1));
  }
}

//导入导出
function handleImport(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    try{
      const j = JSON.parse(ev.target.result);
      if(confirm("导入将覆盖当前全部书签，确定？")){
        data = j;
        backIndex();
      }
    }catch(err){alert('JSON文件错误')}
  }
  r.readAsText(f);
}
function downloadJson(obj,filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

//拖拽排序
let dragIdx = null;
function bindDragEvent(container){
  const items = container.querySelectorAll('.link-item[draggable=true]');
  items.forEach(el=>{
    el.ondragstart = e=>{dragIdx = Number(e.target.dataset.idx)};
    el.ondragover = e=>e.preventDefault();
    el.ondrop = e=>{
      e.preventDefault();
      const targetIdx = Number(e.currentTarget.dataset.idx);
      const realList = currentPath.length===0 ? data.home : getCurrentList();
      const temp = realList[dragIdx];
      realList.splice(dragIdx,1);
      realList.splice(targetIdx,0,temp);
      if(currentPath.length===0){
        renderHomeBookmarks();
      }else{
        renderLinkList(currentPath.at(-1));
      }
    }
  })
}

//页面初始化加载首页书签
window.onload = ()=>{
  renderHomeBookmarks();
}
</script>
</body>
</html>
